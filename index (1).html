function playV(){if(!Q)Q={n:0,s:0};if(Q.n>=5){$("v2").innerHTML=`<div class="card"><h2>🎉 ${Q.s}/5</h2><button class="p" data-a="again">${t("again")}</button></div>`;return}
Q.it=D[Math.random()*D.length|0];$("v2").innerHTML=`<div class="card"><small>${Q.n+1}/5 · ⭐ ${S.pts}</small><h2>${t("bin")}</h2><div style="font-size:24px;margin:6px 0 10px">${Q.it[1][li()]}</div><div id="fb"></div>${Object.keys(B).map(k=>`<button class="bb" style="background:${B[k][0]}" data-a="ans" data-v="${k}">${B[k][1][S.lg]}</button>`).join("")}</div>`}
function impV(){const x=tot(),w=wk(),m=Math.max(1,...w);$("v3").innerHTML=`<div class="card"><h2>📊 ${t("n3")}</h2><div class="grid">${[[x.kg.toFixed(1),t("kg")],["₹"+Math.round(x.rs),t("rs")],[x.co.toFixed(1),t("co")],[Math.round(x.co/.12),t("km")]].map(s=>`<div class="st"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div></div>
<div class="card"><h2>${t("wk")}</h2><div class="ch">${w.map(v=>`<i style="height:${v/m*100}%"></i>`).join("")}</div></div><div class="card"><button class="p w" data-a="share" style="width:100%">💬 WhatsApp</button></div>`}
const wa=m=>open("https://wa.me/?text="+encodeURIComponent(m),"_blank");
const A={lg:v=>{S.lg=v;sv();head();search();card();show(tab)},tab:v=>show(+v),pick:v=>{cur=dd(v);card()},
add:()=>{const w=Math.max(.1,parseFloat($("wt").value)||1);S.led.unshift({k:cur[0],w,t:Date.now()});S.pts+=Math.round(w*10+1);sv();hero();$("out").insertAdjacentHTML("afterbegin",`<div class="alert" style="background:var(--ac)">✅ +${Math.round(w*10+1)} pts</div>`)},
ans:k=>{const ok=k==Q.it[3];if(ok){Q.s++;S.pts+=10;sv()}Q.n++;$("fb").innerHTML=`<div class="alert" style="background:${ok?"var(--ac)":"#d33b3b"}">${ok?t("ok"):t("no")+" "+B[Q.it[3]][1][S.lg]}</div>`;hero();setTimeout(playV,1100)},
again:()=>{Q=null;playV()},
inv:()=>wa(`Join our lane's recycling pool on Kachra2Cash! ${S.hh} homes together can earn from kabadi pickups instead of binning recyclables. – ${S.lane||"our lane"}`),
req:()=>{const m={};S.led.forEach(e=>m[e.k]=(m[e.k]||0)+e.w*S.hh);const it=Object.entries(m).map(([k,w])=>`${dd(k)[1][0]}: ${w.toFixed(0)}kg`).join(", ")||"mixed recyclables";wa(`Namaste! ${S.hh} homes in ${S.lane||"our lane"} (${C[S.city][0]}) have pooled recyclables for one pickup (${it}). Please quote rates and a slot. – via Kachra2Cash`)},
share:()=>{const x=tot();wa(`♻️ My Kachra2Cash impact: ${x.kg.toFixed(1)} kg diverted, ₹${Math.round(x.rs)} recovered, ${x.co.toFixed(1)} kg CO₂ saved. Level points: ${S.pts}. Can your lane beat me?`)}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)A[b.dataset.a](b.dataset.v)});
document.addEventListener("input",e=>{if(e.target.id=="hh"){S.hh=+e.target.value;sv();poolV();$("hh").focus()}if(e.target.id=="ln"){S.lane=e.target.value;sv()}});
$("cty").onchange=e=>{S.city=+e.target.value;sv();card()};$("q").oninput=search;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)$("mic").hidden=true;else $("mic").onclick=()=>{const r=new SR();r.lang={en:"en-IN",hi:"hi-IN",ta:"ta-IN"}[S.lg];r.onresult=e=>{$("q").value=e.results[0][0].transcript;search()};try{r.start()}catch(e){}};
const API="";// paste ApiUrl from `sam deploy` output
let LIVE=null;
async function sync(){if(!API||!S.lane)return;try{await fetch(API+"/lane",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lane:S.lane,pts:S.pts,hh:S.hh})});const j=await(await fetch(API+"/leaderboard")).json();LIVE=j.map(x=>[x.lane,x.pts]);if(tab==1)poolV()}catch(e){}}
if(!API)$("cam").hidden=true;else{$("cam").onclick=()=>$("fi").click();$("fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("out").innerHTML="<small>🔎 Amazon Bedrock scanning...</small>";try{const im=await createImageBitmap(f),s=Math.min(1,768/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const r=await fetch(API+"/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:c.toDataURL("image/jpeg",.8).split(",")[1]})}),j=await r.json(),d=dd(j.key);if(d){cur=d;card()}else $("out").innerHTML="<small>"+t("nf")+"</small>"}catch(x){$("out").innerHTML="<small>"+t("nf")+"</small>"}}}
head();show(0);
</script></body></html>
