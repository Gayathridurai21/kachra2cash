AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kachra2Cash backend - photo scan (Bedrock) and lane leaderboard (DynamoDB)
Parameters:
  ModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
Resources:
  Lanes:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: lane, AttributeType: S}]
      KeySchema: [{AttributeName: lane, KeyType: HASH}]
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration: {AllowOrigins: ['*'], AllowMethods: [GET, POST], AllowHeaders: [content-type]}
      DefaultRouteSettings: {ThrottlingBurstLimit: 5, ThrottlingRateLimit: 2}
  Fn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 25
      MemorySize: 256
      Environment: {Variables: {TABLE: !Ref Lanes, MODEL_ID: !Ref ModelId}}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Lanes}
        - Statement: [{Effect: Allow, Action: [bedrock:InvokeModel], Resource: '*'}]
      Events:
        Scan: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /scan, Method: POST}}
        Lane: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /lane, Method: POST}}
        Board: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /leaderboard, Method: GET}}
Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
